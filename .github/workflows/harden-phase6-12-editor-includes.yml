name: Harden Phase 6-12 Editor includes
on:
  push:
    branches:
      - agent/phases6-12-editor
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/phases6-12-editor
      - run: python3 .github/scripts/harden_phase6_12_editor_includes.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Harden Phase 6-12 Editor module include hygiene"
          git push
