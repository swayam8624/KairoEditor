name: Agent Fix Renderer Pin And Validate UI

on:
  push:
    branches: [complete/reflection-v2-inspector]
    paths: [.github/workflows/agent_fix_renderer_pin_and_validate.yml]

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install native editor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libglfw3-dev libvulkan-dev libgl1-mesa-dev
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Advance KairoRenderer fallback pin
        shell: python
        run: |
          from pathlib import Path
          path = Path("CMakeLists.txt")
          text = path.read_text()
          old = "set(KAIRO_EDITOR_RENDERER_REVISION df5e2fb145c45f072e9d5750f2ac8660ce306ad7)"
          new = "set(KAIRO_EDITOR_RENDERER_REVISION a40b430138f3342c70b02fff222e1d807f0da980)"
          if old not in text:
              raise SystemExit("stale renderer pin anchor not found")
          path.write_text(text.replace(old, new, 1))

      - name: Configure native editor
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKAIRO_EDITOR_BUILD_APP=ON -DKAIRO_EDITOR_BUILD_TESTS=ON

      - name: Build inspector UI and editor app
        run: cmake --build build --target KairoEditorUITests KairoEditorApp --parallel 2

      - name: Run non-interactive UI tests
        run: ctest --test-dir build -R '^KairoEditorUITests$' --output-on-failure

      - name: Commit validated renderer pin
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git diff --cached --check
          git commit -m "build: advance KairoRenderer fallback revision"
          git push origin HEAD:complete/reflection-v2-inspector
