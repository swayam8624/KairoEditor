name: Apply A10 Production Content Browser

on:
  push:
    branches:
      - complete/a10-production-content-browser

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate production content browser
        run: python3 .github/scripts/apply_a10.py
      - name: Commit A10 integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Editor: integrate A10 production content browser"
          git push
