name: Apply Phase 4 build wiring

on:
  push:
    branches:
      - agent/phase4-production-workflows

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase4-production-workflows
      - name: Wire Phase 4 modules and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          marker = '    AIEditorTools.cppm AIEditorSession.cppm EditorState.cppm PanelState.cppm KairoEditor.cppm)'
          replacement = ('    AssetBrowserModel.cppm SceneSelection.cppm EditorDiagnostics.cppm '
                         'SceneFragment.cppm ProjectLifecycle.cppm\n'
                         '    AIEditorTools.cppm AIEditorSession.cppm EditorState.cppm PanelState.cppm KairoEditor.cppm)')
          if marker not in text:
              raise SystemExit('KairoEditor module source marker was not found')
          text = text.replace(marker, replacement, 1)
          test_marker = ('    add_executable(KairoEditorTests tests/EditorTests.cpp)\n'
                         '    target_link_libraries(KairoEditorTests PRIVATE KairoEditor Catch2::Catch2WithMain)')
          test_replacement = (test_marker + '\n'
              '    add_executable(KairoEditorPhase4Tests tests/Phase4WorkflowTests.cpp)\n'
              '    target_link_libraries(KairoEditorPhase4Tests PRIVATE KairoEditor Catch2::Catch2WithMain)')
          if test_marker not in text:
              raise SystemExit('KairoEditor test marker was not found')
          text = text.replace(test_marker, test_replacement, 1)
          add_test_marker = '    add_test(NAME KairoEditorTests COMMAND KairoEditorTests)'
          add_test_replacement = (add_test_marker + '\n'
              '    add_test(NAME KairoEditorPhase4Tests COMMAND KairoEditorPhase4Tests)')
          if add_test_marker not in text:
              raise SystemExit('KairoEditor add_test marker was not found')
          text = text.replace(add_test_marker, add_test_replacement, 1)
          cmake.write_text(text)

          umbrella = Path('KairoEditor.cppm')
          exported = umbrella.read_text()
          export_marker = 'export import Kairo.Editor.ProjectSession;\n'
          export_replacement = (export_marker +
              'export import Kairo.Editor.AssetBrowserModel;\n'
              'export import Kairo.Editor.SceneSelection;\n'
              'export import Kairo.Editor.Diagnostics;\n'
              'export import Kairo.Editor.SceneFragment;\n'
              'export import Kairo.Editor.ProjectLifecycle;\n')
          if export_marker not in exported:
              raise SystemExit('KairoEditor export marker was not found')
          umbrella.write_text(exported.replace(export_marker, export_replacement, 1))
          Path('.github/workflows/apply-phase4-build-wiring.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt KairoEditor.cppm .github/workflows/apply-phase4-build-wiring.yml
          git commit -m 'Wire Phase 4 editor workflows into the build'
          git push origin HEAD:agent/phase4-production-workflows
