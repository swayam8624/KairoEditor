name: Apply A10 Browser Hardening

on:
  push:
    branches:
      - complete/a10-production-content-browser

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden production content browser
        run: python3 .github/scripts/harden_a10.py
      - name: Commit hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Editor: harden A10 browser refresh and restart behavior"
          git push
