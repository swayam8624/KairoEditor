name: Apply Logic Payload Facade

on:
  push:
    branches:
      - complete/reflection-v2-inspector

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Hide generic compiler contracts from project orchestration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          logic = Path('LogicDocumentCompiler.cppm')
          text = logic.read_text()
          old = '''    /// Stable backend accessor used by project-build orchestration. The concrete
    /// compiler lifetime remains owned by this module while generic document
    /// loading, schema validation, diagnostics, and result ownership remain in
    /// Kairo.Editor.DocumentCompiler.
    [[nodiscard]] inline const DocumentCompiler& CoreLogicDocumentCompiler() noexcept
    {
        static const LogicDocumentCompiler compiler;
        return compiler;
    }
'''
          new = '''    /// Project-build facade that keeps the concrete compiler and all generic
    /// document compiler contracts behind their owning module boundaries. The
    /// caller receives only runtime-validated bytecode bytes.
    [[nodiscard]] inline std::vector<std::byte> CompileCoreLogicDocumentFile(
        const std::filesystem::path& sourcePath, std::string_view expectedDocumentID)
    {
        static const LogicDocumentCompiler compiler;
        std::vector<std::byte> payload = CompileDocumentFilePayloadOrThrow(
            sourcePath, expectedDocumentID, DocumentKind::Logic, compiler);
        kairo::engine::ValidateCompiledLogicPayload(payload);
        return payload;
    }
'''
          if old not in text:
              raise SystemExit('logic accessor marker not found')
          logic.write_text(text.replace(old, new, 1))

          Path('.github/workflows/apply-logic-payload-facade.yml').unlink()
          PY
      - name: Commit facade migration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Hide compiler contracts behind logic payload facade"
          git push
