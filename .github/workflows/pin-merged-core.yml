name: Pin merged Core fallback

on:
  push:
    branches: [main]
    paths: [.github/workflows/pin-merged-core.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Pin merged Core revision and self-clean
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('CMakeLists.txt'); s=p.read_text(); old='set(KAIRO_EDITOR_CORE_REVISION agent/phases6-12-runtime)'; new='set(KAIRO_EDITOR_CORE_REVISION f31a6f8889edb03fe15299ad52090f3120b0232c)'; assert old in s; p.write_text(s.replace(old,new))"
          rm .github/workflows/pin-merged-core.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt .github/workflows/pin-merged-core.yml
          git commit -m 'Pin merged Core revision for standalone Editor builds'
          git push origin HEAD:main
