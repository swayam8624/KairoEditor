name: Refresh editor Phase 1-5 dependency pins
on:
  push:
    branches:
      - agent/phase1-5-integration-hardening
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/phase1-5-integration-hardening
      - run: python3 .github/scripts/refresh_phase1_5_pins.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refresh editor Phase 1-5 dependency revisions"
          git push
