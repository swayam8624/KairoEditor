name: Apply Asset Workspace Registration

on:
  push:
    branches:
      - agent/phase4-content-browser-model

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register module and tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          module_marker = '    AuthoringWorkspaceState.cppm\n'
          if '    AssetWorkspace.cppm\n' not in text:
              if module_marker not in text:
                  raise SystemExit('module marker not found')
              text = text.replace(module_marker, module_marker + '    AssetWorkspace.cppm\n', 1)
          test_marker = 'add_executable(KairoEditorTests tests/EditorTests.cpp)'
          replacement = 'add_executable(KairoEditorTests tests/EditorTests.cpp tests/AssetWorkspaceTests.cpp)'
          if replacement not in text:
              if test_marker not in text:
                  raise SystemExit('test target marker not found')
              text = text.replace(test_marker, replacement, 1)
          cmake.write_text(text)

          umbrella = Path('KairoEditor.cppm')
          text = umbrella.read_text()
          marker = 'export import Kairo.Editor.AuthoringWorkspaceState;\n'
          line = 'export import Kairo.Editor.AssetWorkspace;\n'
          if line not in text:
              if marker not in text:
                  raise SystemExit('umbrella marker not found')
              umbrella.write_text(text.replace(marker, marker + line, 1))

          Path('.github/workflows/apply-asset-workspace.yml').unlink()
          PY
      - name: Commit registration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Register editor asset workspace model"
          git push
