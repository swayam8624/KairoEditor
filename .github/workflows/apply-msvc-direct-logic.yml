name: Apply MSVC Direct Logic Build

on:
  push:
    branches:
      - complete/reflection-v2-inspector

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Keep logic build off generic result wrapper
        shell: bash
        run: echo '' | base64 -d | python3
      - name: Commit direct logic build
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Compile logic builds without generic result wrapper"
          git push
