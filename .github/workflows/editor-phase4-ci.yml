name: KairoEditor Phase 4 CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu Clang
            os: ubuntu-24.04
            compiler: clang
          - name: macOS LLVM
            os: macos-14
            compiler: brew-llvm
          - name: Windows MSVC
            os: windows-2022
            compiler: msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Ubuntu toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Install LLVM and Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install llvm ninja
      - name: Activate MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: bash
        run: |
          set +e
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            export CC=clang
            export CXX=clang++
          elif [[ "${{ matrix.compiler }}" == "brew-llvm" ]]; then
            export PATH="$(brew --prefix llvm)/bin:$PATH"
            export CC="$(brew --prefix llvm)/bin/clang"
            export CXX="$(brew --prefix llvm)/bin/clang++"
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DKAIRO_EDITOR_BUILD_APP=OFF -DKAIRO_EDITOR_BUILD_TESTS=ON 2>&1 | tee configure.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            message=$(tail -n 60 configure.log); message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error file=configure.log,title=Configure failure::$message"
          fi
          exit $status
      - name: Build
        shell: bash
        run: |
          set +e
          cmake --build build --parallel 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            diagnostics=$(grep -Ei -C 3 '(^|[^a-z])(fatal error|error C[0-9]+|error:|FAILED:|undefined reference|unresolved external)' build.log | tail -n 80)
            if [[ -z "$diagnostics" ]]; then diagnostics=$(tail -n 60 build.log); fi
            diagnostics=${diagnostics//'%'/'%25'}; diagnostics=${diagnostics//$'\r'/'%0D'}; diagnostics=${diagnostics//$'\n'/'%0A'}
            echo "::error file=build.log,title=Build failure::$diagnostics"
          fi
          exit $status
      - name: Test
        shell: bash
        run: |
          set +e
          ctest --test-dir build --output-on-failure 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            message=$(tail -n 80 test.log); message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error file=test.log,title=Test failure::$message"
          fi
          exit $status
