name: KairoEditor Phase 4 CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu Clang
            os: ubuntu-24.04
            compiler: clang
          - name: macOS LLVM
            os: macos-14
            compiler: brew-llvm
          - name: Windows MSVC
            os: windows-2022
            compiler: msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Ubuntu toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Install LLVM and Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install llvm ninja
      - name: Activate MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: bash
        run: |
          set +e
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            export CC=clang
            export CXX=clang++
          elif [[ "${{ matrix.compiler }}" == "brew-llvm" ]]; then
            export PATH="$(brew --prefix llvm)/bin:$PATH"
            export CC="$(brew --prefix llvm)/bin/clang"
            export CXX="$(brew --prefix llvm)/bin/clang++"
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DKAIRO_EDITOR_BUILD_APP=OFF -DKAIRO_EDITOR_BUILD_TESTS=ON 2>&1 | tee configure.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            message=$(tail -n 60 configure.log); message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error file=configure.log,title=Configure failure::$message"
          fi
          exit $status
      - name: Build
        shell: bash
        run: |
          set +e
          cmake --build build --parallel 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            diagnostics=$(grep -Ei -C 3 '(^|[^a-z])(fatal error|error C[0-9]+|error:|FAILED:|undefined reference|unresolved external)' build.log | tail -n 80)
            if [[ -z "$diagnostics" ]]; then diagnostics=$(tail -n 60 build.log); fi
            diagnostics=${diagnostics//'%'/'%25'}; diagnostics=${diagnostics//$'\r'/'%0D'}; diagnostics=${diagnostics//$'\n'/'%0A'}
            echo "::error file=build.log,title=Build failure::$diagnostics"
          fi
          exit $status
      - name: Test
        shell: bash
        run: |
          set +e
          ctest --test-dir build --output-on-failure 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            message=$(tail -n 80 test.log); message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error file=test.log,title=Test failure::$message"
          fi
          exit $status

  native-ui:
    name: Ubuntu Native ImGui
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install native editor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libglfw3-dev libvulkan-dev libgl1-mesa-dev glslang-tools xvfb
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Configure native editor
        shell: bash
        run: |
          set +e
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKAIRO_EDITOR_BUILD_APP=ON \
            -DKAIRO_EDITOR_BUILD_TESTS=ON 2>&1 | tee native-configure.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            message=$(tail -n 100 native-configure.log); message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error file=native-configure.log,title=Native editor configure failure::$message"
          fi
          exit $status
      - name: Build native editor and UI integration tests
        shell: bash
        run: |
          set +e
          cmake --build build --parallel 2 --target \
            KairoEditorApp \
            KairoEditorUITests \
            KairoEditorRenderBridgeTests \
            KairoEditorPhysicsPreviewTests 2>&1 | tee native-build.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            message=$(tail -n 100 native-build.log); message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error file=native-build.log,title=Native editor build failure::$message"
          fi
          exit $status
      - name: Test native UI integration surfaces
        shell: bash
        run: |
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            ctest --test-dir build --output-on-failure \
            -R "KairoEditorUITests|KairoEditorRenderBridgeTests|KairoEditorPhysicsPreviewTests" 2>&1 | tee native-test.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            message=$(tail -n 100 native-test.log); message=${message//'%'/'%25'}; message=${message//$'\r'/'%0D'}; message=${message//$'\n'/'%0A'}
            echo "::error file=native-test.log,title=Native editor test failure::$message"
          fi
          exit $status
      - name: Upload native editor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-native-ui-diagnostics
          path: |
            native-configure.log
            native-build.log
            native-test.log
          if-no-files-found: ignore
          retention-days: 7
