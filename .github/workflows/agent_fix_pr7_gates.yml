name: Agent Fix PR7 Gates

on:
  push:
    branches: [complete/reflection-v2-inspector]
    paths: [.github/workflows/agent_fix_pr7_gates.yml]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: complete/reflection-v2-inspector

      - name: Apply cross-platform build repairs
        shell: python
        run: |
          from pathlib import Path

          # macOS libc++ does not expose floating std::from_chars until newer
          # deployment targets. Keep integer from_chars, but parse doubles with
          # the classic C locale and require complete token consumption.
          serialization = Path('DocumentSerialization.cppm')
          text = serialization.read_text()
          include_anchor = '#include <limits>\n#include <optional>\n'
          if include_anchor not in text:
              raise SystemExit('DocumentSerialization include anchor not found')
          text = text.replace(include_anchor, '#include <limits>\n#include <locale>\n#include <optional>\n', 1)
          old_parse = '''        [[nodiscard]] inline double ParseDouble(const FormatToken& token, std::size_t line)\n        {\n            double value = 0.0;\n            const auto [end, error] = std::from_chars(token.Text.data(), token.Text.data() + token.Text.size(), value,\n                std::chars_format::general);\n            if (error != std::errc{} || end != token.Text.data() + token.Text.size() || !std::isfinite(value))\n                throw DocumentFormatError(line, token.Column, "invalid finite floating-point value");\n            return value;\n        }\n'''
          new_parse = '''        [[nodiscard]] inline double ParseDouble(const FormatToken& token, std::size_t line)\n        {\n            double value = 0.0;\n            std::istringstream input{ token.Text };\n            input.imbue(std::locale::classic());\n            input >> std::noskipws >> value;\n            if (!input || !input.eof() || !std::isfinite(value))\n                throw DocumentFormatError(line, token.Column, "invalid finite floating-point value");\n            return value;\n        }\n'''
          if old_parse not in text:
              raise SystemExit('ParseDouble anchor not found')
          serialization.write_text(text.replace(old_parse, new_parse, 1))

          # Keep the module interface light for MSVC 19.44. Its frontend ICEs
          # while emitting the current heavy inline build function into an IFC.
          interface = Path('ProjectLogicBuild.cppm')
          interface.write_text('''module;\n\n#include <filesystem>\n#include <vector>\n\nexport module Kairo.Editor.ProjectLogicBuild;\n\nimport Kairo.Assets;\nimport Kairo.Editor.ProjectDocuments;\nimport Kairo.EngineCore.Scene;\n\nexport namespace kairo::editor\n{\n    struct BuiltLogicArtifact final\n    {\n        kairo::assets::AssetID Document;\n        std::filesystem::path SourcePath;\n        std::filesystem::path ArtifactPath;\n    };\n\n    /// Compiles every logic document attached to the current scene before\n    /// publishing any portable runtime artifacts. Fails closed on missing,\n    /// dirty, wrong-kind, invalid, or dependency-cyclic documents.\n    [[nodiscard]] std::vector<BuiltLogicArtifact> BuildAttachedLogicArtifacts(\n        const std::filesystem::path& projectRoot,\n        const kairo::engine::Scene& scene,\n        const kairo::assets::AssetRegistry& assets,\n        ProjectDocuments& documents);\n\n    [[nodiscard]] std::vector<BuiltLogicArtifact> BuildProjectLogic(\n        const std::filesystem::path& projectRoot,\n        const kairo::engine::Scene& scene,\n        const kairo::assets::AssetRegistry& assets,\n        ProjectDocuments& documents);\n}\n''')

          Path('ProjectLogicBuildImpl.cpp').write_text('''module;\n\n#include <filesystem>\n#include <set>\n#include <stdexcept>\n#include <string>\n#include <utility>\n#include <vector>\n\nmodule Kairo.Editor.ProjectLogicBuild;\n\nimport Kairo.Assets;\nimport Kairo.Editor.CoreDocumentSchemas;\nimport Kairo.Editor.DocumentCompiler;\nimport Kairo.Editor.DocumentTypes;\nimport Kairo.Editor.LogicDocumentCompiler;\nimport Kairo.Editor.ProjectDocuments;\nimport Kairo.EngineCore.LogicArtifact;\nimport Kairo.EngineCore.Scene;\n\nnamespace kairo::editor\n{\n    std::vector<BuiltLogicArtifact> BuildAttachedLogicArtifacts(\n        const std::filesystem::path& projectRoot,\n        const kairo::engine::Scene& scene,\n        const kairo::assets::AssetRegistry& assets,\n        ProjectDocuments& documents)\n    {\n        if (projectRoot.empty())\n            throw std::invalid_argument("Attached logic build requires a project root.");\n\n        std::set<kairo::assets::AssetID> attached;\n        for (const kairo::engine::Entity entity : scene.Entities())\n            if (const auto logic = scene.Logic(entity); logic.has_value())\n                attached.insert(logic->DocumentAsset);\n        if (attached.empty()) return {};\n\n        DocumentSchemaRegistry schemas = BuildCoreDocumentSchemas();\n        DocumentCompilerRegistry compilers;\n        compilers.Register(MakeLogicDocumentCompiler());\n\n        std::vector<std::pair<BuiltLogicArtifact, kairo::engine::CompiledLogicArtifact>> pending;\n        pending.reserve(attached.size());\n\n        for (const kairo::assets::AssetID id : attached)\n        {\n            const auto metadata = assets.Find(id);\n            if (!metadata.has_value())\n                throw std::runtime_error("Scene references an unregistered logic document asset.");\n            if (metadata->Type != kairo::assets::AssetType::Document)\n                throw std::runtime_error("Scene logic attachment does not reference a document asset.");\n            const auto kind = DocumentKindFromPath(metadata->Path);\n            if (!kind.has_value() || *kind != DocumentKind::Logic)\n                throw std::runtime_error("Scene logic attachment is not a .klogic document.");\n\n            bool openedHere = false;\n            if (!documents.Contains(id))\n            {\n                documents.Open(metadata->Path, id);\n                openedHere = true;\n            }\n\n            try\n            {\n                const AuthoringDocument& document = documents.Get(id);\n                if (document.IsDirty())\n                    throw std::runtime_error("Attached logic document must be saved before build.");\n                const DocumentCompileResult result = CompileDocument(document, schemas, compilers);\n                if (!result.Succeeded() || !result.Artifact.has_value())\n                    throw std::runtime_error("Attached logic document failed compilation.");\n                const kairo::engine::LogicProgram program =\n                    kairo::engine::ParseLogicProgram(result.Artifact->Payload);\n                kairo::engine::CompiledLogicArtifact artifact;\n                artifact.Source = id;\n                artifact.SourceFingerprint = kairo::assets::FingerprintFile(projectRoot / metadata->Path);\n                artifact.Program = program;\n                const std::filesystem::path artifactPath =\n                    kairo::engine::CompiledLogicArtifactPath(projectRoot, id);\n                pending.push_back({ { id, metadata->Path, artifactPath }, std::move(artifact) });\n                if (openedHere) documents.Close(id);\n            }\n            catch (...)\n            {\n                if (openedHere && documents.Contains(id))\n                    documents.Close(id);\n                throw;\n            }\n        }\n\n        std::vector<BuiltLogicArtifact> built;\n        built.reserve(pending.size());\n        for (auto& [record, artifact] : pending)\n        {\n            kairo::engine::SaveCompiledLogicArtifact(record.ArtifactPath, artifact);\n            built.push_back(std::move(record));\n        }\n        return built;\n    }\n\n    std::vector<BuiltLogicArtifact> BuildProjectLogic(\n        const std::filesystem::path& projectRoot,\n        const kairo::engine::Scene& scene,\n        const kairo::assets::AssetRegistry& assets,\n        ProjectDocuments& documents)\n    {\n        return BuildAttachedLogicArtifacts(projectRoot, scene, assets, documents);\n    }\n}\n''')

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          pin_anchor = 'set(KAIRO_EDITOR_RENDERER_REVISION af289df8f26e7d4fb78e66bb3bee1b1fcf3caab2)\n'
          if pin_anchor not in text:
              raise SystemExit('Renderer revision anchor not found')
          text = text.replace(pin_anchor, pin_anchor +
              'set(KAIRO_EDITOR_REALTIME_BRIDGE_REVISION 7b131d06078c8ff3c648d53536c046d6f7891f99)\n', 1)

          link_anchor = 'target_link_libraries(KairoEditor PUBLIC KairoEngineCore KairoAssets KairoAI nlohmann_json::nlohmann_json)\n'
          if link_anchor not in text:
              raise SystemExit('KairoEditor link anchor not found')
          text = text.replace(link_anchor,
              'target_sources(KairoEditor PRIVATE ProjectLogicBuildImpl.cpp)\n' + link_anchor, 1)

          renderer_end = '''            FetchContent_MakeAvailable(KairoRenderer)\n        endif()\n    endif()\n\n    include(FetchContent)\n    FetchContent_Declare(DearImGui\n'''
          bridge_block = '''            FetchContent_MakeAvailable(KairoRenderer)\n        endif()\n    endif()\n\n    # The realtime scene bridge is an umbrella runtime component rather than an\n    # EngineCore module. A standalone Editor build fetches only that source\n    # revision and defines the same narrow target used by KairoGameEngine.\n    if(NOT TARGET KairoRealtimeRenderBridge)\n        include(FetchContent)\n        FetchContent_Declare(KairoRealtimeBridgeSource\n            GIT_REPOSITORY https://github.com/swayam8624/KairoGameEngine.git\n            GIT_TAG ${KAIRO_EDITOR_REALTIME_BRIDGE_REVISION}\n            GIT_SHALLOW TRUE\n            GIT_SUBMODULES ""\n            SOURCE_SUBDIR KairoNoCMakeProject)\n        FetchContent_MakeAvailable(KairoRealtimeBridgeSource)\n        add_library(KairoRealtimeRenderBridge STATIC)\n        target_sources(KairoRealtimeRenderBridge\n            PUBLIC FILE_SET CXX_MODULES TYPE CXX_MODULES\n            BASE_DIRS ${kairorealtimebridgesource_SOURCE_DIR}/Runtime/KairoRealtimeRenderBridge\n            FILES ${kairorealtimebridgesource_SOURCE_DIR}/Runtime/KairoRealtimeRenderBridge/RealtimeSceneBridge.cppm)\n        target_link_libraries(KairoRealtimeRenderBridge\n            PUBLIC KairoEngineCore KairoRenderer KairoAssets)\n    endif()\n\n    include(FetchContent)\n    FetchContent_Declare(DearImGui\n'''
          if renderer_end not in text:
              raise SystemExit('Renderer block anchor not found')
          cmake.write_text(text.replace(renderer_end, bridge_block, 1))

          # Do not ship the one-off mutating workflow.
          Path('.github/workflows/agent_fix_pr7_gates.yml').unlink()

      - name: Commit repaired PR head
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "build: repair Editor cross-platform integration gates"
          git push origin HEAD:complete/reflection-v2-inspector
