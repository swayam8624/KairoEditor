name: Apply Phase 7 Stability Fix

on:
  push:
    branches:
      - complete/reflection-v2-inspector

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch recovery ordering
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('ProjectRecovery.cppm')
          text = path.read_text()
          if '#include <limits>\n' not in text:
              text = text.replace('#include <fstream>\n', '#include <fstream>\n#include <limits>\n', 1)

          old = '''        const auto now = std::chrono::duration_cast<std::chrono::milliseconds>(
            std::chrono::system_clock::now().time_since_epoch()).count();
        const auto root = RecoveryRoot(canonicalRoot);
        std::error_code error;
        std::filesystem::create_directories(root, error);
        if (error) throw std::runtime_error("Cannot create project recovery directory: " + error.message());
        const std::string name = SnapshotName(now);
        const auto staging = root / (name + ".staging");
        const auto published = root / name;
        RecoverySnapshot snapshot{ published, canonicalRoot, safeProject, safeScene, now, {} };
'''
          new = '''        const auto wallClockNow = std::chrono::duration_cast<std::chrono::milliseconds>(
            std::chrono::system_clock::now().time_since_epoch()).count();
        const auto root = RecoveryRoot(canonicalRoot);
        std::error_code error;
        std::filesystem::create_directories(root, error);
        if (error) throw std::runtime_error("Cannot create project recovery directory: " + error.message());

        // Recovery points may be created several times within one clock millisecond.
        // Retention ordering must still reflect creation order rather than the random
        // directory suffix. Admit a timestamp strictly newer than every valid
        // published snapshot, which also keeps ordering stable if the wall clock
        // moves backwards between recovery points.
        std::int64_t created = wallClockNow;
        for (const auto& entry : std::filesystem::directory_iterator(root))
        {
            if (!entry.is_directory() || !entry.path().filename().string().starts_with("snapshot-")) continue;
            try
            {
                const RecoverySnapshot existing = LoadRecoverySnapshot(entry.path());
                if (existing.CreatedUnixMilliseconds >= created)
                {
                    if (existing.CreatedUnixMilliseconds == std::numeric_limits<std::int64_t>::max())
                        throw std::overflow_error("Recovery snapshot timestamp space is exhausted.");
                    created = existing.CreatedUnixMilliseconds + 1;
                }
            }
            catch (const std::overflow_error&) { throw; }
            catch (...) { /* Corrupt snapshots do not participate in retention ordering. */ }
        }

        const std::string name = SnapshotName(created);
        const auto staging = root / (name + ".staging");
        const auto published = root / name;
        RecoverySnapshot snapshot{ published, canonicalRoot, safeProject, safeScene, created, {} };
'''
          if old not in text:
              raise SystemExit('recovery creation block not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/apply-phase7-stability.yml').unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make recovery rotation deterministic"
          git push
