name: Apply MSVC Document Boundary

on:
  push:
    branches:
      - complete/reflection-v2-inspector

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Move file compilation behind DocumentCompiler
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          logic = Path('LogicDocumentCompiler.cppm')
          text = logic.read_text()
          marker = '    /// Builds one persisted logic document into a runtime payload while keeping\n'
          if marker not in text:
              raise SystemExit('logic helper marker not found')
          prefix = text.split(marker, 1)[0]
          logic.write_text(prefix + '''    /// Stable backend accessor used by project-build orchestration. The concrete\n    /// compiler lifetime remains owned by this module while generic document\n    /// loading, schema validation, diagnostics, and result ownership remain in\n    /// Kairo.Editor.DocumentCompiler.\n    [[nodiscard]] inline const DocumentCompiler& CoreLogicDocumentCompiler() noexcept\n    {\n        static const LogicDocumentCompiler compiler;\n        return compiler;\n    }\n}\n''')

          compiler = Path('DocumentCompiler.cppm')
          text = compiler.read_text()
          if '#include <filesystem>\n' not in text:
              text = text.replace('#include <exception>\n', '#include <exception>\n#include <filesystem>\n', 1)
          if 'import Kairo.Editor.CoreDocumentSchemas;\n' not in text:
              text = text.replace('import Kairo.Editor.AuthoringDocument;\n',
                                  'import Kairo.Editor.AuthoringDocument;\nimport Kairo.Editor.CoreDocumentSchemas;\n', 1)
          if 'import Kairo.Editor.DocumentSerialization;\n' not in text:
              text = text.replace('import Kairo.Editor.DocumentSchema;\n',
                                  'import Kairo.Editor.DocumentSchema;\nimport Kairo.Editor.DocumentSerialization;\n', 1)

          insert = '''\n    /// Checked file-to-payload boundary for project builds. AuthoringDocument,\n    /// core-schema, diagnostic, and DocumentCompileResult lifetimes all remain\n    /// inside their owning module; callers receive only validated compiler bytes.\n    [[nodiscard]] inline std::vector<std::byte> CompileDocumentFilePayloadOrThrow(\n        const std::filesystem::path& sourcePath,\n        std::string_view expectedDocumentID,\n        DocumentKind expectedKind,\n        const DocumentCompiler& compiler)\n    {\n        if (sourcePath.empty())\n            throw std::invalid_argument("Document compiler requires a source path.");\n        if (expectedDocumentID.empty())\n            throw std::invalid_argument("Document compiler requires an expected document ID.");\n\n        const AuthoringDocument document = LoadDocument(sourcePath);\n        if (document.ID().ToString() != expectedDocumentID)\n            throw std::invalid_argument(\n                "Document file identity disagrees with its asset metadata: " +\n                sourcePath.generic_string());\n        if (document.Kind() != expectedKind)\n            throw std::invalid_argument(\n                "Document kind disagrees with its build target: " +\n                sourcePath.generic_string());\n\n        const DocumentSchemaRegistry schemas = CreateCoreDocumentSchemaRegistry();\n        return CompileDocumentPayloadOrThrow(document, schemas, compiler);\n    }\n'''
          closing = '\n}\n'
          if 'CompileDocumentFilePayloadOrThrow(' not in text:
              if not text.endswith(closing):
                  raise SystemExit('document compiler namespace closing marker not found')
              text = text[:-len(closing)] + insert + closing
          compiler.write_text(text)

          project = Path('ProjectLogicBuildImpl.cpp')
          text = project.read_text()
          if 'import Kairo.Editor.DocumentCompiler;\n' not in text:
              text = text.replace('import Kairo.Assets;\n',
                                  'import Kairo.Assets;\nimport Kairo.Editor.DocumentCompiler;\nimport Kairo.Editor.DocumentTypes;\n', 1)
          old = '            staged.Payload = CompileLogicDocumentFile(sourcePath, id.ToString());\n            staged.Fingerprint = kairo::assets::FingerprintFile(sourcePath);\n'
          new = '''            try\n            {\n                staged.Payload = CompileDocumentFilePayloadOrThrow(\n                    sourcePath, id.ToString(), DocumentKind::Logic, CoreLogicDocumentCompiler());\n                kairo::engine::ValidateCompiledLogicPayload(staged.Payload);\n            }\n            catch (const std::exception& error)\n            {\n                throw std::runtime_error(\n                    "Logic build failed for " + sourcePath.generic_string() +\n                    " (" + std::string(error.what()) + ")");\n            }\n            staged.Fingerprint = kairo::assets::FingerprintFile(sourcePath);\n'''
          if old not in text:
              raise SystemExit('project compile call marker not found')
          text = text.replace(old, new, 1)
          if '#include <stdexcept>\n' not in text:
              text = text.replace('#include <set>\n', '#include <set>\n#include <stdexcept>\n#include <string>\n', 1)
          project.write_text(text)

          Path('.github/workflows/apply-msvc-document-boundary.yml').unlink()
          PY
      - name: Commit boundary migration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Keep document build lifetimes in owning modules"
          git push
